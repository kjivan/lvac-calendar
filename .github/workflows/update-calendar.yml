name: Update LVAC calendar

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [docs/lvac-classes.ics]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}lvac-classes.ics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest -v

      - name: Build feed
        run: python lvac_calendar.py docs/lvac-classes.ics

      # Committing keeps past classes for the next run and keeps the scheduled workflow active
      - name: Commit feed if the schedule changed
        run: |
          if git diff --quiet -- docs/lvac-classes.ics && git ls-files --error-unmatch docs/lvac-classes.ics >/dev/null 2>&1; then
            echo "No schedule changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/lvac-classes.ics
          git commit -m "Update LVAC classes"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
